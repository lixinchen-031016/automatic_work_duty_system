# =============================================================================
# 自动值班排班系统 — CI/CD 工作流
# -----------------------------------------------------------------------------
# 架构分析：
#   - 类型    : 跨平台桌面应用（PySide6 / Qt GUI），非服务端程序
#   - 运行时  : Python 3.10+（README 推荐 3.11/3.13）
#   - 技术栈  : PySide6、pandas、xlrd、openpyxl、SQLite；PyInstaller 打包
#   - 测试    : pytest（test_system.py 端到端 + 算法/存储/界面/性能回归），
#              界面测试使用 QT_QPA_PLATFORM=offscreen，Ubuntu 无需显示器
#   - 部署目标: 桌面分发产物，统一发布到 GitHub Releases（nightly 滚动预发布
#              + tag 正式发布），避免每次代码更新都膨胀版本号
#
# 触发条件 : 推送 main 分支 / 推送 v* 标签 / 向 main 发起 PR / 手动触发
# 作业结构 : test →(门禁)→ build-windows(x64/arm64 矩阵) / build-macos 并行构建 →(汇合)→ deploy
# 条件部署 : 仅「推送（main 或 tag）」时执行 deploy，PR 与手动触发不发布
#
# 版本策略（避免代码更新后的版本号问题）：
#   - 日常推送 main → 覆盖式「nightly」预发布（自动删除上一次 nightly，
#     标题携带 commit 短哈希，可追溯），无需打版本号
#   - 正式发版     → 推送 v* 标签（如 v1.0.0）→ 正式 Release（非预发布）
# =============================================================================

name: CI/CD - 自动值班排班系统

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# 同一分支/PR 只保留最新一次运行，取消进行中的旧运行，节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  APP_NAME: "DutyScheduler"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 0) 测试门禁：算法 / 存储 / 界面（offscreen）/ 性能回归
  #    - 纯后端 + offscreen 界面测试，Ubuntu 上无需显示器
  #    - 构建作业依赖本作业，测试不通过则不出包（防止带着回归发版）
  # ---------------------------------------------------------------------------
  test:
    name: 运行测试（pytest）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 安装 Qt 运行库（offscreen 界面测试所需）
        run: |
          sudo apt-get update || true
          # 缺少运行库时测试会直接报「could not load the Qt platform plugin」，
          # 因此这里不让 apt 的偶发失败阻断流水线，把问题留给明确的测试失败
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            || echo "Qt 运行库安装未完成，继续运行测试"

      - name: 校验测试样例（脱敏样例与原始课表一致）
        run: |
          # 仓库里提交的是 samples/desensitized/（真实课表的脱敏副本）。
          # 本地若存在原始课表，这一步会逐字段比对，防止样例与真实格式漂移；
          # CI 上没有原始文件时脚本直接返回 0，属于正常情况。
          python tools/desensitize_samples.py --check

      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  # ---------------------------------------------------------------------------
  # 1) 构建 Windows 单文件 exe（x86_64 / ARM64 原生矩阵）
  #    - x86_64: windows-latest + x64 CPython
  #    - ARM64 : windows-11-arm + ARM64 CPython，生成 Windows on ARM 原生程序
  #    - fail-fast: false 保证一个架构失败时另一架构仍能完成并上传诊断产物
  # ---------------------------------------------------------------------------
  build-windows:
    name: 构建 Windows ${{ matrix.arch }} (.exe)
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            python_arch: x64
            expected_machine: AMD64
            artifact_name: windows-x64
            asset_name: DutyScheduler.exe
          - arch: arm64
            runner: windows-11-arm
            python_arch: arm64
            expected_machine: ARM64
            artifact_name: windows-arm64
            asset_name: DutyScheduler-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python（${{ matrix.arch }}）
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 校验 Python 与 ${{ matrix.arch }} 架构
        shell: pwsh
        run: |
          $details = python -c "import platform, struct; print(platform.machine(), struct.calcsize('P') * 8, sep='|')"
          $parts = $details -split '\|'
          $machine = $parts[0]
          $bits = [int]$parts[1]
          python --version
          Write-Host "platform.machine=$machine, pointer-bits=$bits"
          if ($machine -ne "${{ matrix.expected_machine }}") {
            throw "期望架构 ${{ matrix.expected_machine }}，实际为 $machine"
          }
          if ($bits -ne 64) {
            throw "期望 64 位 Python，实际指针宽度为 $bits 位"
          }

      - name: 打包单文件 exe（无控制台窗口）
        shell: pwsh
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ${{ env.APP_NAME }}
          --hidden-import xlrd
          --add-data "assets;assets"
          app.py

      - name: 生成架构标识产物名
        shell: pwsh
        run: |
          $source = "dist/${{ env.APP_NAME }}.exe"
          $target = "dist/${{ matrix.asset_name }}"
          if ($source -ne $target) {
            Move-Item -Force -Path $source -Destination $target
          }

      - name: 冒烟启动 Windows 应用
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # onefile 首次启动需解压运行时（PySide6+pandas 约 100MB），ARM64 预留更久
          $exe = "dist/${{ matrix.asset_name }}"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 30
          if ($process.HasExited) {
            throw "${{ matrix.asset_name }} 在启动后提前退出，退出码: $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: 上传 Windows ${{ matrix.arch }} 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error # .exe 是核心产物，缺失即视为失败
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2) 构建 macOS ARM64 原生产物（.app + .dmg）
  # ---------------------------------------------------------------------------
  build-macos:
    name: 构建 macOS arm64 (.app / .dmg)
    needs: test
    runs-on: macos-latest # Apple Silicon 运行器，原生 arm64 构建
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python（原生 arm64）
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 校验 arm64 架构
        run: python -c "import platform, sys; print(sys.version); assert platform.machine() == 'arm64', platform.machine()"

      - name: 打包 .app（窗口模式）
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name ${{ env.APP_NAME }}
          --hidden-import xlrd
          --add-data "assets:assets"
          app.py

      - name: 冒烟启动 macOS 应用
        run: |
          APP="dist/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}"
          "$APP" >/tmp/duty-macos-smoke.log 2>&1 &
          APP_PID=$!
          sleep 10
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat /tmp/duty-macos-smoke.log
            exit 1
          fi
          kill "$APP_PID"
          wait "$APP_PID" || true

      - name: 制作 DMG（含 Applications 拖拽安装）
        run: |
          rm -rf dmg && mkdir dmg
          cp -R "dist/${{ env.APP_NAME }}.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "${{ env.APP_NAME }}" \
            -srcfolder dmg -ov -format UDZO \
            "${{ env.APP_NAME }}-macOS-arm64.dmg"

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ env.APP_NAME }}-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3) 条件部署：仅「推送 main 或 tag」时，发布到 GitHub Releases
  #    - 推送 v* 标签 → 正式 Release（非预发布）
  #    - 推送 main   → 滚动 nightly 预发布（覆盖上一次 nightly，标题带 commit 哈希）
  #    - PR / 手动触发 → 不发布（产物仅在 Artifacts）
  # ---------------------------------------------------------------------------
  deploy:
    name: 发布到 GitHub Releases
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write # 创建 Release 所需
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 Windows x64 产物
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows-x64

      - name: 下载 Windows ARM64 产物
        uses: actions/download-artifact@v4
        with:
          name: windows-arm64
          path: artifacts/windows-arm64

      - name: 下载 macOS 产物
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos

      - name: 计算发布元数据
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}"                          >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                                >> "$GITHUB_OUTPUT"
            echo "title=自动值班排班系统 ${GITHUB_REF_NAME}"        >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly"                                     >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                                 >> "$GITHUB_OUTPUT"
            echo "title=自动值班排班系统 nightly (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
            # 清理上一次 nightly，保持单一滚动预发布（避免版本号膨胀）
            gh release delete nightly --yes || true
            git push --delete origin nightly 2>/dev/null || true
          fi

      - name: 发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --generate-notes \
            $([ "${{ steps.meta.outputs.prerelease }}" = "true" ] && echo "--prerelease") \
            "artifacts/windows-x64/${{ env.APP_NAME }}.exe" \
            "artifacts/windows-arm64/${{ env.APP_NAME }}-windows-arm64.exe" \
            "artifacts/macos/${{ env.APP_NAME }}-macOS-arm64.dmg"
